name: Analytic response CI

on:
  push:
    branches:
      - feat/fixed-analytic-response-network
  pull_request:

jobs:
  response-network:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q sdfmpneo run.py
      - name: Focused response-network tests
        run: >-
          python -m pytest -q
          tests/test_fixed_response_network.py
          tests/test_research_convergence_setup.py
          tests/test_high_rank_trial_control.py
          tests/test_thermal_horizon_diagnostic.py
          tests/test_high_rank_fixed_response.py
          tests/test_research_training.py
          tests/test_research_trial_telemetry.py
          tests/test_modal_heat_projection.py
          tests/test_geometry_context_runtime.py
          tests/test_fast_reduced_equivalence.py
