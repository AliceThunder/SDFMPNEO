name: residual-state-test

on:
  push:
    branches:
      - feat/residual-driven-analytic-states
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run targeted and full tests
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_residual_driven_analytic_states.py \
            tests/test_geometry_research.py \
            tests/test_research_workflow.py \
            -W error::numpy.exceptions.ComplexWarning \
            -W error::scipy.linalg.LinAlgWarning
          targeted=$?
          python -m pytest -q \
            -W error::numpy.exceptions.ComplexWarning \
            -W error::scipy.linalg.LinAlgWarning
          full=$?
          echo "targeted_exit=$targeted" | tee test-exit-codes.txt
          echo "full_exit=$full" | tee -a test-exit-codes.txt
          if [ "$targeted" -ne 0 ] || [ "$full" -ne 0 ]; then
            exit 1
          fi
      - name: Upload checked-out source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residual-state-source
          path: |
            .
            !.git/**
          retention-days: 1
