name: SDF-MPNEO core tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Gmsh runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa
      - name: Install
        run: python -m pip install -e '.[dev,gui,cad]'
      - name: Verify Gmsh runtime
        run: |
          python - <<'PY'
          import gmsh
          gmsh.initialize()
          try:
              version = gmsh.option.getString("General.Version")
              print(f"Gmsh runtime: {version}")
          finally:
              gmsh.finalize()
          PY
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          pytest -q
          -W error::numpy.exceptions.ComplexWarning
          -W error::scipy.linalg.LinAlgWarning
