[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdfmpneo"
version = "0.8.0"
description = "Certified inexact-Riesz sparse physical-energy tetrahedral electromagnetic-thermal analytic core for SDF-MPNEO"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["sdfmpneo*"]
