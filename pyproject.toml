[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdfmpneo"
version = "0.10.0"
description = "Solution-data-free electromagnetic-thermal surrogate training and arbitrary-time inference for research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
sdfmpneo = "sdfmpneo.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
cad = ["gmsh>=4.11"]

[tool.setuptools.packages.find]
include = ["sdfmpneo*"]
