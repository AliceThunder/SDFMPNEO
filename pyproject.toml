[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdfmpneo"
version = "0.10.0"
description = "Solution-data-free electromagnetic-thermal surrogate training and arbitrary-time inference for research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "threadpoolctl>=3.1"]

[project.scripts]
sdfmpneo = "sdfmpneo.__main__:main"
sdfmpneo-neural = "sdfmpneo.electrothermal_tensor.cli:main"
sdfmpneo-domain = "sdfmpneo.electrothermal_tensor.domain_cli:main"
sdfmpneo-certify = "sdfmpneo.electrothermal_tensor.certify_cli:main"
sdfmpneo-diagnose = "sdfmpneo.electrothermal_tensor.diagnose_cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
cad = ["gmsh>=4.11"]
gui = ["PyQt6>=6.5", "pyqtgraph>=0.13.3"]
neural = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["sdfmpneo*"]

[tool.setuptools.package-data]
sdfmpneo = [
    "cpp_training_backend.cpp",
    "cpp_dag_combined.cpp",
    "cpp_dag_values.inc",
    "cpp_dag_backend.inc",
    "cpp_thread_probe.inc",
]
